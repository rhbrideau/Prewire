<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Tightline Time</title>
<meta name="theme-color" content="#0e1419">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Time">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="../icon-180.png">
<style>
  :root{
    --bg:#0e1419;--panel:#161f27;--panel2:#1d2832;--line:#2a3845;
    --ink:#eef4f8;--mut:#8499a8;--accent:#6fc4ff;--accent2:#3d8ec4;
    --warn:#ffb648;--good:#5fd39a;--bad:#ff6b6b;
    color-scheme:dark;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  body{padding:calc(14px + env(safe-area-inset-top)) 16px 60px;max-width:600px;margin:0 auto}
  .num{font-variant-numeric:tabular-nums}
  header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px;gap:10px}
  h1{font-size:18px;letter-spacing:.02em;font-weight:800}
  h1 span{color:var(--accent)}
  .who{font-size:12px;color:var(--mut);text-align:right}
  .who a{color:var(--accent);text-decoration:none;margin-left:8px}
  h2{font-size:13px;color:var(--mut);text-transform:uppercase;letter-spacing:.12em;margin:22px 0 8px}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
  .hero{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
  .hero .k{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.1em}
  .hero .v{font-size:34px;font-weight:800;color:var(--accent);line-height:1.1}
  .hero .v small{font-size:15px;color:var(--mut);font-weight:600}
  .badge{display:inline-block;font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px;letter-spacing:.04em}
  .badge.ok{background:rgba(95,211,154,.15);color:var(--good)}
  .badge.wait{background:rgba(255,182,72,.15);color:var(--warn)}

  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .grid .full{grid-column:1 / -1}
  label.f{display:flex;flex-direction:column;gap:5px;font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.08em;min-width:0}
  input,select,textarea{width:100%;min-width:0;background:var(--panel2);border:1px solid var(--line);color:var(--ink);
    border-radius:8px;padding:11px 10px;font-size:16px;font-family:inherit;-webkit-appearance:none;appearance:none}
  input[type=time],input[type=date]{min-height:46px}
  textarea{resize:vertical;min-height:46px}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
  .calc{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:14px;color:var(--mut)}
  .calc b{font-size:22px;color:var(--ink)}
  .calc b.bad{color:var(--bad);font-size:14px}
  .hint{font-size:12px;color:var(--warn);margin-top:8px;line-height:1.4}

  button{font-family:inherit;cursor:pointer}
  .btn{width:100%;border:0;border-radius:10px;padding:14px;font-size:16px;font-weight:800;letter-spacing:.03em;
    background:var(--accent);color:#06263b;margin-top:12px}
  .btn:active{filter:brightness(.9)}
  .btn:disabled{opacity:.5}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink);font-weight:600}
  .btn.danger{background:transparent;border:1px solid rgba(255,107,107,.4);color:var(--bad);font-weight:600}
  .btn.good{background:var(--good);color:#063b22}
  .row2{display:flex;gap:8px}
  .row2 .btn{flex:1}

  .weeknav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:22px 0 8px}
  .weeknav button{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:22px}
  .weeknav .lbl{text-align:center;font-weight:700;font-size:15px}
  .weeknav .lbl small{display:block;font-size:11px;color:var(--mut);font-weight:500;margin-top:2px}

  .days{display:flex;flex-direction:column;gap:6px}
  .day{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
  .day.today{border-color:var(--accent2)}
  .dhead{display:flex;justify-content:space-between;font-size:13px;color:var(--mut);font-weight:600}
  .dhead b{color:var(--ink)}
  .ent{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0 2px;border:0;background:none;color:inherit;width:100%;text-align:left;font-size:14px}
  .ent + .ent{border-top:1px solid var(--line);margin-top:6px}
  .ent .t{font-weight:600}
  .ent .j{font-size:12px;color:var(--mut);margin-top:2px;overflow-wrap:anywhere}
  .ent .h{font-weight:800;white-space:nowrap}
  .pend{color:var(--warn);font-size:11px;font-weight:700}
  .none{font-size:13px;color:var(--mut);padding-top:4px}

  .totals{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
  .totals .paybox{grid-column:1 / -1;display:flex;justify-content:space-between;align-items:center}
  .totals .paybox .v{font-size:24px;margin:0}
  .totals div{background:var(--panel2);border-radius:8px;padding:8px}
  .totals .k{font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:.08em}
  .totals .v{font-size:17px;font-weight:800;margin-top:2px}
  .totals .v.pay{color:var(--good)}
  .emphead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
  .emphead .n{font-size:17px;font-weight:800}
  .emphead .r{font-size:12px;color:var(--mut)}
  table{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
  td{padding:8px 4px;border-top:1px solid var(--line);vertical-align:top}
  td.h{text-align:right;font-weight:700;white-space:nowrap}
  tr.tap{cursor:pointer}
  tr.tap:active td{background:var(--panel2)}
  .muted{color:var(--mut)}

  .status{font-size:12px;color:var(--mut);text-align:center;margin-top:16px;min-height:16px}
  .status.warn{color:var(--warn)}
  .toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);
    padding:11px 16px;border-radius:10px;font-size:14px;font-weight:600;max-width:calc(100% - 32px);z-index:50;display:none}
  .toast.err{background:var(--bad);color:#fff}

  .sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center;z-index:40}
  .sheet.open{display:flex}
  .sheet .card{width:100%;max-width:600px;border-radius:16px 16px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
  .sheet h3{font-size:17px;margin-bottom:12px}

  .center{max-width:380px;margin:12vh auto 0;text-align:center}
  .center p{color:var(--mut);font-size:14px;line-height:1.5;margin:10px 0 16px}
  .pin{text-align:center;font-size:28px;letter-spacing:.3em;font-weight:800}
  .small{font-size:12px;color:var(--mut);line-height:1.5;margin-top:14px}
  .small a{color:var(--accent)}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<div class="sheet" id="sheet"><div class="card" id="sheetBody"></div></div>

<script>
/* ---------- storage ---------- */
const LS = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} },
};
let cfg = LS.get('tt_cfg', {});
let outbox = LS.get('tt_outbox', []);
let cache = LS.get('tt_cache', {});        // weekStart -> {entries, approved}
let state = { role: cfg.role || null, name: cfg.name || '', weekStart: mondayOf(todayStr()), owner: null, recentJobs: LS.get('tt_jobs', []) };
let syncing = false, lastError = '';

/* ---------- date + time helpers ---------- */
function pad(n){ return (n < 10 ? '0' : '') + n; }
function todayStr(){ const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()); }
function parseD(s){ const p = s.split('-').map(Number); return new Date(Date.UTC(p[0], p[1]-1, p[2])); }
function fmtD(d){ return d.getUTCFullYear() + '-' + pad(d.getUTCMonth()+1) + '-' + pad(d.getUTCDate()); }
function addDays(s, n){ const d = parseD(s); d.setUTCDate(d.getUTCDate() + n); return fmtD(d); }
function mondayOf(s){ const d = parseD(s); d.setUTCDate(d.getUTCDate() - (d.getUTCDay() + 6) % 7); return fmtD(d); }
const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'], MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function dayLabel(s){ const d = parseD(s); return DOW[d.getUTCDay()] + ' ' + MON[d.getUTCMonth()] + ' ' + d.getUTCDate(); }
function shortDate(s){ const d = parseD(s); return MON[d.getUTCMonth()] + ' ' + d.getUTCDate(); }
function weekLabel(ws){ return shortDate(ws) + ' to ' + shortDate(addDays(ws, 6)); }
function toMin(t){ const p = String(t).split(':'); return (+p[0]) * 60 + (+p[1]); }
function workMin(e){ if(!e.start || !e.end) return 0; let s = toMin(e.end) - toMin(e.start); if (s < 0) s += 1440; return s - (+e.breakMin || 0); }
function hrs(min){ return (min / 60).toFixed(2); }
function clock(t){ let [h, m] = t.split(':').map(Number); const ap = h >= 12 ? 'pm' : 'am'; h = h % 12 || 12; return h + ':' + pad(m) + ap; }
function money(n){ return '$' + n.toLocaleString(undefined, {minimumFractionDigits:2, maximumFractionDigits:2}); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function pay(min, rate, otAfter, otMult){
  const reg = Math.min(min, otAfter * 60), ot = Math.max(0, min - otAfter * 60);
  return { reg, ot, total: min, gross: Math.round(((reg/60) * rate + (ot/60) * rate * otMult) * 100) / 100 };
}

/* ---------- api ---------- */
class NetError extends Error {}
async function api(action, payload){
  let res;
  try{
    res = await fetch(cfg.api, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify(Object.assign({ action, pin: cfg.pin }, payload || {})) });
  }catch(e){ throw new NetError('No connection'); }
  let j;
  try{ j = await res.json(); }catch(e){ throw new Error('The Google script did not answer correctly. Check it is deployed with access set to Anyone.'); }
  if (!j.ok) throw new Error(j.error || 'Something went wrong');
  return j;
}

/* ---------- ui helpers ---------- */
const $ = id => document.getElementById(id);
let toastT;
function toast(msg, err){ const t = $('toast'); t.textContent = msg; t.className = 'toast' + (err ? ' err' : ''); t.style.display = 'block'; clearTimeout(toastT); toastT = setTimeout(() => t.style.display = 'none', err ? 4500 : 2200); }
function openSheet(html){ $('sheetBody').innerHTML = html; $('sheet').classList.add('open'); }
function closeSheet(){ $('sheet').classList.remove('open'); $('sheetBody').innerHTML = ''; }
$('sheet').addEventListener('click', e => { if (e.target.id === 'sheet') closeSheet(); });
async function copyText(t){
  try{ await navigator.clipboard.writeText(t); return true; }
  catch(e){ const a = document.createElement('textarea'); a.value = t; document.body.appendChild(a); a.select(); let ok = false; try{ ok = document.execCommand('copy'); }catch(_){} a.remove(); return ok; }
}

/* ---------- entry form (shared by new + edit, employee + owner) ---------- */
function formHTML(e, opts){
  const jobs = state.recentJobs.map(j => `<option value="${esc(j)}">`).join('');
  const brks = [0, 15, 30, 45, 60, 90];
  if (brks.indexOf(+e.breakMin) === -1) brks.push(+e.breakMin);
  const empSel = opts.employees ? `<label class="f full">Employee<select id="f_emp">${opts.employees.map(n => `<option ${n === e.employee ? 'selected' : ''}>${esc(n)}</option>`).join('')}</select></label>` : '';
  return `
  <div class="grid">
    ${empSel}
    <label class="f full">Date<input type="date" id="f_date" value="${esc(e.date)}" max="${todayStr()}"></label>
    <label class="f">Start<input type="time" id="f_start" value="${esc(e.start)}"></label>
    <label class="f">End<input type="time" id="f_end" value="${esc(e.end)}"></label>
    <label class="f">Break<select id="f_break">${brks.sort((a,b)=>a-b).map(b => `<option value="${b}" ${b == e.breakMin ? 'selected' : ''}>${b ? b + ' min' : 'None'}</option>`).join('')}</select></label>
    <label class="f">Job / customer<input id="f_job" list="joblist" value="${esc(e.job)}" placeholder="e.g. Smith house" autocomplete="off"></label>
    <datalist id="joblist">${jobs}</datalist>
    <label class="f full">Notes<textarea id="f_notes" rows="2" placeholder="Optional">${esc(e.notes)}</textarea></label>
  </div>
  <div class="calc"><span>Hours worked</span><b id="f_calc">0.00</b></div>
  <div class="hint" id="f_hint"></div>`;
}
function readForm(base){
  const v = id => $(id) ? $(id).value : '';
  return Object.assign({}, base, { date: v('f_date'), start: v('f_start'), end: v('f_end'), breakMin: +v('f_break') || 0,
    job: v('f_job').trim(), notes: v('f_notes').trim(), employee: $('f_emp') ? v('f_emp') : base.employee });
}
function formProblem(e){
  if (!e.date) return 'Pick a date';
  if (e.date > todayStr()) return 'That date is in the future';
  if (!e.start || !e.end) return 'Enter a start and end time';
  const m = workMin(e);
  if (m <= 0) return 'Hours come out to zero. Check start, end, and break.';
  if (m > 16 * 60) return 'That is more than 16 hours. Check the times.';
  return '';
}
function wireForm(base, hintFn){
  const upd = () => {
    const e = readForm(base), p = formProblem(e), c = $('f_calc');
    if (p && (e.start && e.end)) { c.textContent = p; c.className = 'bad'; }
    else { c.textContent = hrs(Math.max(0, workMin(e))) + ' hrs'; c.className = ''; }
    if (hintFn) $('f_hint').textContent = hintFn(e) || '';
  };
  ['f_date','f_start','f_end','f_break','f_job','f_notes','f_emp'].forEach(id => { const el = $(id); if (el){ el.addEventListener('input', upd); el.addEventListener('change', upd); } });
  upd();
}

/* ---------- screens ---------- */
function render(){
  if (!cfg.api) return renderSetup();
  if (!cfg.pin) return renderLogin();
  if (state.role === 'owner') return renderOwner();
  return renderEmployee();
}

function renderSetup(){
  $('app').innerHTML = `
  <div class="center">
    <h1>TIGHTLINE <span>TIME</span></h1>
    <p>Paste the web app link from your Google Sheet script. You only do this once per phone. After that, use the share link on your owner screen to set up your employee's phone.</p>
    <input id="apiIn" placeholder="https://script.google.com/macros/s/.../exec" autocapitalize="off" autocorrect="off">
    <button class="btn" id="apiGo">Continue</button>
  </div>`;
  $('apiGo').onclick = () => {
    const v = $('apiIn').value.trim();
    if (!/^https:\/\/script\.google(usercontent)?\.com\//.test(v)) return toast('That does not look like a Google script link', true);
    cfg.api = v; LS.set('tt_cfg', cfg); render();
  };
}

function renderLogin(){
  $('app').innerHTML = `
  <div class="center">
    <h1>TIGHTLINE <span>TIME</span></h1>
    <p>Enter your PIN. This phone will stay signed in.</p>
    <input id="pinIn" class="pin" type="password" inputmode="numeric" autocomplete="off" maxlength="12">
    <button class="btn" id="pinGo">Sign in</button>
    <p class="small"><a href="#" id="resetApi">Wrong setup link? Start over</a></p>
  </div>`;
  const go = async () => {
    const pin = $('pinIn').value.trim(); if (!pin) return;
    $('pinGo').disabled = true; $('pinGo').textContent = 'Checking...';
    const prev = cfg.pin; cfg.pin = pin;
    try{
      const r = await api('auth');
      cfg.role = r.role; cfg.name = r.name; LS.set('tt_cfg', cfg);
      state.role = r.role; state.name = r.name;
      render(); load();
    }catch(e){
      cfg.pin = prev; toast(e instanceof NetError ? 'No connection. Try again when you have signal.' : e.message, true);
      $('pinGo').disabled = false; $('pinGo').textContent = 'Sign in';
    }
  };
  $('pinGo').onclick = go;
  $('pinIn').onkeydown = e => { if (e.key === 'Enter') go(); };
  $('resetApi').onclick = e => { e.preventDefault(); cfg = {}; LS.set('tt_cfg', cfg); render(); };
  $('pinIn').focus();
}

function signOut(){
  if (!confirm('Sign out on this phone?')) return;
  if (outbox.length && !confirm('There are entries that have not synced yet. Signing out will throw them away. Continue?')) return;
  cfg = { api: cfg.api }; LS.set('tt_cfg', cfg);
  outbox = []; LS.set('tt_outbox', outbox); cache = {}; LS.set('tt_cache', cache);
  state.role = null; state.owner = null; render();
}

function weekNavHTML(extra){
  const cur = state.weekStart === mondayOf(todayStr());
  return `<div class="weeknav">
    <button id="wPrev" aria-label="Previous week">&lsaquo;</button>
    <div class="lbl">${weekLabel(state.weekStart)}<small>${cur ? 'This week' : extra || '&nbsp;'}</small></div>
    <button id="wNext" aria-label="Next week" ${cur ? 'disabled style="opacity:.35"' : ''}>&rsaquo;</button>
  </div>`;
}
function wireWeekNav(){
  $('wPrev').onclick = () => { state.weekStart = addDays(state.weekStart, -7); render(); load(); };
  $('wNext').onclick = () => { if (state.weekStart >= mondayOf(todayStr())) return; state.weekStart = addDays(state.weekStart, 7); render(); load(); };
}

/* ----- employee ----- */
function weekData(ws){ return cache[ws] || { entries: [], approved: false, loaded: false }; }
function pendingIds(){ const s = {}; outbox.forEach(o => { s[o.op === 'save' ? o.entry.id : o.id] = 1; }); return s; }

function renderEmployee(){
  const wk = weekData(state.weekStart), pend = pendingIds();
  const total = wk.entries.reduce((t, e) => t + workMin(e), 0);
  const today = todayStr();
  const last = LS.get('tt_last', { start: '08:00', end: '16:00', breakMin: 30, job: '' });
  const isCur = state.weekStart === mondayOf(today);

  let days = '';
  for (let i = 0; i < 7; i++){
    const d = addDays(state.weekStart, i);
    if (d > today) continue;
    const list = wk.entries.filter(e => e.date === d).sort((a, b) => a.start < b.start ? -1 : 1);
    const dm = list.reduce((t, e) => t + workMin(e), 0);
    days = `<div class="day ${d === today ? 'today' : ''}">
      <div class="dhead"><b>${dayLabel(d)}</b><span class="num">${dm ? hrs(dm) + ' hrs' : ''}</span></div>
      ${list.length ? list.map(e => `<button class="ent" data-id="${esc(e.id)}" ${wk.approved ? 'disabled' : ''}>
          <div><div class="t">${clock(e.start)} to ${clock(e.end)}${e.breakMin ? ` <span class="muted">(${e.breakMin}m break)</span>` : ''}</div>
          <div class="j">${esc(e.job || 'No job name')}${e.notes ? ' &middot; ' + esc(e.notes) : ''}</div></div>
          <div class="h num">${hrs(workMin(e))}${pend[e.id] ? '<div class="pend">not synced</div>' : ''}</div></button>`).join('')
        : '<div class="none">No time logged</div>'}
    </div>` + days;
  }

  $('app').innerHTML = `
  <header><h1>TIGHTLINE <span>TIME</span></h1><div class="who">${esc(state.name)}<a href="#" id="out">Sign out</a></div></header>
  <div class="card hero">
    <div><div class="k">${isCur ? 'This week' : 'Week of ' + shortDate(state.weekStart)}</div><div class="v num">${hrs(total)} <small>hrs</small></div></div>
    <div>${wk.approved ? '<span class="badge ok">Approved, locked</span>' : ''}</div>
  </div>

  <h2>Log time</h2>
  <div class="card" id="newCard">
    ${formHTML({ date: today, start: last.start, end: last.end, breakMin: last.breakMin, job: last.job, notes: '' }, {})}
    <button class="btn" id="saveNew">Save hours</button>
  </div>

  ${weekNavHTML(wk.approved ? 'Approved' : '')}
  <div class="days">${days}</div>
  <div class="status" id="status"></div>`;

  $('out').onclick = e => { e.preventDefault(); signOut(); };
  wireWeekNav();
  wireForm({}, e => {
    const ws = mondayOf(e.date || today), w = weekData(ws);
    if (w.approved) return 'That week is approved and locked. Ask your boss to change it.';
    const same = w.entries.filter(x => x.date === e.date);
    if (same.length) return 'You already logged ' + same.map(x => clock(x.start) + ' to ' + clock(x.end)).join(', ') + ' on this day. Saving adds another entry. Tap the existing one below to edit it instead.';
    return '';
  });
  $('saveNew').onclick = () => {
    const e = readForm({ id: uid() }); const p = formProblem(e);
    if (p) return toast(p, true);
    if (weekData(mondayOf(e.date)).approved) return toast('That week is approved and locked.', true);
    LS.set('tt_last', { start: e.start, end: e.end, breakMin: e.breakMin, job: e.job });
    queue({ op: 'save', entry: e });
    state.weekStart = mondayOf(e.date);
    toast('Saved ' + hrs(workMin(e)) + ' hrs for ' + dayLabel(e.date));
    render();
  };
  document.querySelectorAll('.ent[data-id]').forEach(b => b.onclick = () => editEmployeeEntry(b.dataset.id));
  showStatus();
}

function editEmployeeEntry(id){
  const e = weekData(state.weekStart).entries.find(x => x.id === id); if (!e) return;
  openSheet(`<h3>Edit entry</h3>${formHTML(e, {})}
    <button class="btn" id="eSave">Save changes</button>
    <div class="row2"><button class="btn danger" id="eDel">Delete</button><button class="btn ghost" id="eCancel">Cancel</button></div>`);
  wireForm(e);
  $('eCancel').onclick = closeSheet;
  $('eSave').onclick = () => {
    const n = readForm(e), p = formProblem(n); if (p) return toast(p, true);
    if (weekData(mondayOf(n.date)).approved) return toast('That week is approved and locked.', true);
    queue({ op: 'save', entry: n }); closeSheet(); toast('Updated'); render();
  };
  $('eDel').onclick = () => { if (!confirm('Delete this entry?')) return; queue({ op: 'delete', id }); closeSheet(); toast('Deleted'); render(); };
}

/* offline queue: every change goes here first, then syncs when there is signal */
function applyLocal(op){
  Object.keys(cache).forEach(ws => { cache[ws].entries = cache[ws].entries.filter(x => x.id !== (op.op === 'save' ? op.entry.id : op.id)); });
  if (op.op === 'save'){
    const ws = mondayOf(op.entry.date);
    if (!cache[ws]) cache[ws] = { entries: [], approved: false, loaded: false };
    cache[ws].entries.push(op.entry);
  }
}
function queue(op){
  if (op.op === 'save') op.entry = { id: op.entry.id, date: op.entry.date, start: op.entry.start, end: op.entry.end, breakMin: op.entry.breakMin, job: op.entry.job, notes: op.entry.notes };
  outbox.push(op); LS.set('tt_outbox', outbox);
  applyLocal(op); LS.set('tt_cache', cache);
  flush();
}
async function flush(){
  if (syncing || !outbox.length) return showStatus();
  syncing = true; showStatus();
  let changed = false;
  while (outbox.length){
    const op = outbox[0];
    try{
      if (op.op === 'save') await api('save', { entry: op.entry }); else await api('delete', { id: op.id });
      lastError = '';
    }catch(e){
      if (e instanceof NetError){ lastError = 'offline'; break; }
      toast('Could not save: ' + e.message, true); lastError = '';
    }
    outbox.shift(); LS.set('tt_outbox', outbox); changed = true;
  }
  syncing = false;
  if (changed && !outbox.length) await load(true);
  showStatus();
}
function showStatus(){
  const s = $('status'); if (!s) return;
  if (outbox.length){ s.className = 'status warn'; s.textContent = syncing ? 'Syncing...' : outbox.length + ' change' + (outbox.length > 1 ? 's' : '') + ' saved on this phone. They will sync when you have signal.'; }
  else { s.className = 'status'; s.textContent = lastError === 'offline' ? 'Offline. Showing saved data.' : 'All hours synced'; }
}

/* ----- owner ----- */
function renderOwner(){
  const d = state.owner && state.owner.weekStart === state.weekStart ? state.owner : null;
  let body = '<div class="status">Loading...</div>';
  if (d){
    body = d.employees.length ? d.employees.map((emp, i) => {
      const list = emp.entries.slice().sort((a, b) => (a.date + a.start) < (b.date + b.start) ? -1 : 1);
      const min = list.reduce((t, e) => t + workMin(e), 0);
      const p = pay(min, emp.rate, d.overtimeAfter, d.overtimeMultiplier);
      const days = {}; list.forEach(e => days[e.date] = 1);
      return `<div class="card" style="margin-bottom:12px">
        <div class="emphead"><div><div class="n">${esc(emp.name)}</div><div class="r">${money(emp.rate)}/hr &middot; ${Object.keys(days).length} day${Object.keys(days).length === 1 ? '' : 's'}</div></div>
          ${emp.approved ? '<span class="badge ok">Approved</span>' : '<span class="badge wait">Needs approval</span>'}</div>
        ${list.length ? `<table>${list.map(e => `<tr class="tap" data-emp="${i}" data-id="${esc(e.id)}">
            <td><b>${dayLabel(e.date)}</b><div class="muted">${clock(e.start)} to ${clock(e.end)}${e.breakMin ? ', ' + e.breakMin + 'm break' : ''}</div></td>
            <td>${esc(e.job || '')}${e.notes ? `<div class="muted">${esc(e.notes)}</div>` : ''}</td>
            <td class="h num">${hrs(workMin(e))}</td></tr>`).join('')}</table>` : '<div class="none">No hours logged this week</div>'}
        <div class="totals">
          <div><div class="k">Total</div><div class="v num">${hrs(p.total)}</div></div>
          <div><div class="k">Regular</div><div class="v num">${hrs(p.reg)}</div></div>
          <div><div class="k">Overtime</div><div class="v num" ${p.ot ? 'style="color:var(--warn)"' : ''}>${hrs(p.ot)}</div></div>
          <div class="paybox"><div class="k">Gross pay${p.ot ? ' (incl. OT at ' + d.overtimeMultiplier + 'x)' : ''}</div><div class="v pay num">${money(p.gross)}</div></div>
        </div>
        <div class="row2">
          <button class="btn ghost" data-add="${i}">+ Add entry</button>
          ${emp.approved ? `<button class="btn ghost" data-unapprove="${i}">Unlock week</button>` : `<button class="btn good" data-approve="${i}">Approve week</button>`}
        </div>
      </div>`;
    }).join('') : '<div class="card none">No employees found. Add one on the Employees tab of your Google Sheet.</div>';
  }

  $('app').innerHTML = `
  <header><h1>TIGHTLINE <span>TIME</span></h1><div class="who">Owner<a href="#" id="out">Sign out</a></div></header>
  ${weekNavHTML('Payroll week')}
  ${body}
  ${d ? `<div class="row2"><button class="btn ghost" id="copySum">Copy payroll summary</button><button class="btn ghost" id="csv">Download CSV</button></div>` : ''}
  <h2>Employee phone setup</h2>
  <div class="card">
    <div class="small" style="margin-top:0">Text this link to your employee. He opens it on his phone, enters his PIN from the Employees tab, then taps Share &gt; Add to Home Screen.</div>
    <button class="btn ghost" id="shareLink">Copy setup link</button>
  </div>
  <div class="status" id="ostatus"></div>`;

  $('out').onclick = e => { e.preventDefault(); signOut(); };
  wireWeekNav();
  $('shareLink').onclick = async () => {
    const u = location.origin + location.pathname + '?api=' + encodeURIComponent(cfg.api);
    if (navigator.share){ try{ await navigator.share({ title: 'Tightline Time', text: 'Log your hours here:', url: u }); return; }catch(e){ if (e.name === 'AbortError') return; } }
    toast(await copyText(u) ? 'Link copied' : 'Could not copy. Link: ' + u);
  };
  if (!d) return;
  document.querySelectorAll('tr.tap').forEach(tr => tr.onclick = () => {
    const emp = d.employees[+tr.dataset.emp]; ownerEdit(emp.entries.find(e => e.id === tr.dataset.id), emp.name);
  });
  document.querySelectorAll('[data-add]').forEach(b => b.onclick = () => {
    const emp = d.employees[+b.dataset.add];
    const date = state.weekStart === mondayOf(todayStr()) ? todayStr() : state.weekStart;
    ownerEdit({ id: uid(), date, start: '08:00', end: '16:00', breakMin: 30, job: '', notes: '' }, emp.name, true);
  });
  document.querySelectorAll('[data-approve],[data-unapprove]').forEach(b => b.onclick = async () => {
    const i = +(b.dataset.approve || b.dataset.unapprove), approve = b.dataset.approve != null, emp = d.employees[i];
    if (!approve && !confirm('Unlock this week? ' + emp.name + ' will be able to edit it again, and the Payroll tab row is removed.')) return;
    b.disabled = true;
    try{ await api('approve', { employee: emp.name, weekStart: state.weekStart, approved: approve }); toast(approve ? 'Approved and locked' : 'Unlocked'); await load(true); }
    catch(e){ toast(e.message, true); b.disabled = false; }
  });
  $('copySum').onclick = async () => { const ok = await copyText(summaryText(d)); toast(ok ? 'Summary copied' : 'Could not copy', !ok); };
  $('csv').onclick = () => downloadCSV(d);
}

function ownerEdit(e, empName, isNew){
  const names = state.owner.employees.map(x => x.name);
  openSheet(`<h3>${isNew ? 'Add entry' : 'Edit entry'}</h3>${formHTML(Object.assign({ employee: empName }, e), { employees: names })}
    <button class="btn" id="eSave">${isNew ? 'Add' : 'Save changes'}</button>
    <div class="row2">${isNew ? '' : '<button class="btn danger" id="eDel">Delete</button>'}<button class="btn ghost" id="eCancel">Cancel</button></div>`);
  wireForm(Object.assign({ employee: empName }, e));
  $('eCancel').onclick = closeSheet;
  $('eSave').onclick = async () => {
    const n = readForm(Object.assign({ employee: empName }, e)), p = formProblem(n); if (p) return toast(p, true);
    $('eSave').disabled = true;
    try{
      const emp = n.employee; delete n.employee;
      await api('save', { entry: n, employee: emp }); closeSheet(); toast('Saved'); await load(true);
    }catch(err){ toast(err instanceof NetError ? 'No connection' : err.message, true); $('eSave').disabled = false; }
  };
  if ($('eDel')) $('eDel').onclick = async () => {
    if (!confirm('Delete this entry?')) return;
    try{ await api('delete', { id: e.id }); closeSheet(); toast('Deleted'); await load(true); }
    catch(err){ toast(err instanceof NetError ? 'No connection' : err.message, true); }
  };
}

function summaryText(d){
  const lines = ['Payroll: week of ' + weekLabel(d.weekStart) + ', ' + parseD(d.weekStart).getUTCFullYear()];
  d.employees.forEach(emp => {
    const min = emp.entries.reduce((t, e) => t + workMin(e), 0), p = pay(min, emp.rate, d.overtimeAfter, d.overtimeMultiplier);
    lines.push(emp.name + ': ' + hrs(p.total) + ' hrs (' + hrs(p.reg) + ' regular, ' + hrs(p.ot) + ' overtime) at ' + money(emp.rate) + '/hr = ' + money(p.gross) + (emp.approved ? '' : ' [not approved]'));
  });
  return lines.join('\n');
}
function downloadCSV(d){
  const q = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
  const rows = [['Employee','Date','Start','End','Break (min)','Hours','Job','Notes']];
  d.employees.forEach(emp => {
    emp.entries.slice().sort((a, b) => (a.date + a.start) < (b.date + b.start) ? -1 : 1)
      .forEach(e => rows.push([emp.name, e.date, e.start, e.end, e.breakMin, hrs(workMin(e)), e.job, e.notes]));
    const min = emp.entries.reduce((t, e) => t + workMin(e), 0), p = pay(min, emp.rate, d.overtimeAfter, d.overtimeMultiplier);
    rows.push([emp.name + ' TOTAL', '', '', '', '', hrs(p.total), 'Regular ' + hrs(p.reg) + ' / OT ' + hrs(p.ot), 'Gross ' + money(p.gross)]);
  });
  const blob = new Blob([rows.map(r => r.map(q).join(',')).join('\r\n')], { type: 'text/csv' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'hours-' + d.weekStart + '.csv';
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

/* ---------- loading ---------- */
async function load(quiet){
  const ws = state.weekStart;
  try{
    const r = await api('week', { weekStart: ws });
    if (r.role !== state.role){ state.role = r.role; cfg.role = r.role; LS.set('tt_cfg', cfg); }
    if (r.recentJobs){ state.recentJobs = r.recentJobs; LS.set('tt_jobs', r.recentJobs); }
    if (r.role === 'owner'){ state.owner = r; }
    else {
      cache[ws] = { entries: r.entries, approved: r.approved, loaded: true };
      outbox.forEach(applyLocal);   // keep unsynced changes on screen
      LS.set('tt_cache', cache);
    }
    lastError = '';
  }catch(e){
    if (e instanceof NetError) lastError = 'offline';
    else if (/PIN/i.test(e.message)){ toast(e.message, true); if (/Wrong PIN/.test(e.message)){ cfg = { api: cfg.api }; LS.set('tt_cfg', cfg); } }
    else if (!quiet) toast(e.message, true);
  }
  if (state.weekStart !== ws) return;
  // Do not wipe out a form the employee is typing in.
  const typing = document.activeElement && /^f_/.test(document.activeElement.id || '') && !$('sheet').classList.contains('open');
  if (state.role === 'employee' && typing) { showStatus(); return; }
  if ($('sheet').classList.contains('open')) return;
  render();
}

/* ---------- boot ---------- */
(function boot(){
  const qs = new URLSearchParams(location.search);
  if (qs.get('api')){
    const a = qs.get('api');
    if (/^https:\/\/script\.google(usercontent)?\.com\//.test(a) && a !== cfg.api){ cfg = { api: a }; LS.set('tt_cfg', cfg); }
    history.replaceState(null, '', location.pathname);
  }
  render();
  if (cfg.api && cfg.pin){ load(); flush(); }
  window.addEventListener('online', flush);
  setInterval(() => { if (outbox.length) flush(); }, 30000);
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'visible' || !cfg.pin) return;
    if (state.role === 'employee' && state.weekStart < mondayOf(todayStr()) && !document.activeElement.id) state.weekStart = mondayOf(todayStr());
    flush(); load(true);
  });
  if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
})();
</script>
